name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Api build + test
        run: |
          dotnet build MockBucket.slnx -c Release
          dotnet test  MockBucket.slnx -c Release --no-build

      - name: Docker image build (no push — pushing is tag-driven, see publish.yml)
        run: docker build -t mockbucket:ci .
