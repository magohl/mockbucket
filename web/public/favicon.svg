<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MockBucket mark: an open bucket catching data (emerald = the accent of MOCK<span>BUCKET</span>).
      Ink-dark rounded square so the mark reads on both light and dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#181d25"/>
  <!-- handle -->
  <path d="M21 24 C21 11 43 11 43 24" fill="none" stroke="#f2f2f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- what's being captured, falling in -->
  <path d="M32 16.5 L36 21.5 L28 21.5 Z" fill="#10b981"/>
  <!-- rim -->
  <rect x="14" y="25" width="36" height="6" rx="3" fill="#f2f2f0"/>
  <!-- body -->
  <path d="M18 31 L46 31 L41.5 51.5 L22.5 51.5 Z" fill="#f2f2f0"/>
  <!-- caught payload -->
  <path d="M20.4 41.5 L43.6 41.5 L41.5 51.5 L22.5 51.5 Z" fill="#10b981"/>
</svg>
