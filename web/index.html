<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MockBucket</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#181d25" />
    <script>
      // Theme before first paint: stored choice, else system preference — no flash.
      try {
        const t = localStorage.getItem("mb_theme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body class="bg-canvas font-ui text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
